  const turmaTxt = p.turma ? (p.turma+' · '+p.fase) : p.papel;
  let html = '<div class="card" style="border-left:4px solid '+c.tx+'">';
  html += '<div class="card-head"><p class="card-name">'+p.nome+'</p>'+badge(turmaTxt,p.cor)+'</div>';
  html += '<p class="card-role">'+p.papel+'</p>';
  if(p.cuidadores.length){ html += '<p class="section-label">quem cuida de '+p.nome.split(' ')[0]+'</p>'; html += p.cuidadores.map(c=>roleLine(c[0],c[1])).join(''); }
  if(p.cuidados.length){ html += '<p class="section-label">quem '+p.nome.split(' ')[0]+' cuida</p>'; html += p.cuidados.map(c=>roleLine(c.papel_do_vinculo,c.nome+' ('+c.turma+')')).join(''); }
  if(!p.cuidadores.length && !p.cuidados.length){ html += '<p class="empty">nenhum vínculo registrado ainda</p>'; }
  html += '</div>';
  document.getElementById('card').innerHTML = html;
}
window.selectPerson = function(nome){
  const p = DATA.find(x=>x.nome===nome);
  document.getElementById('q').value = p.nome;
  document.getElementById('list').innerHTML = '';
  renderCard(p);
};
document.getElementById('q').addEventListener('input', function(e){
  const v = e.target.value.trim().toLowerCase();
  document.getElementById('card').innerHTML = '';
  if(v.length < 2){ document.getElementById('list').innerHTML=''; return; }
  const matches = DATA.filter(p=>p.nome.toLowerCase().includes(v));
  if(matches.length===1){ selectPerson(matches[0].nome); } else { renderList(matches); }
});
function renderTables(){
  let html = '';
  TABLES.forEach(function(t){
    const c = RAMP[t.cor]||RAMP.gray;
    html += '<div class="turma-block">';
    html += '<div class="turma-head" style="background:'+c.hd+';color:'+c.tx+'">'+t.turma+' · fase '+t.fase+' · '+t.total+' pessoas</div>';
    html += '<table><thead><tr style="background:'+c.bg+'"><th style="color:'+c.tx+'">Nº</th><th style="color:'+c.tx+'">Aluno</th>' + t.headers.map(h=>'<th style="color:'+c.tx+'">'+h+'</th>').join('') + '</tr></thead><tbody>';
    t.rows.forEach(function(r, i){
      html += '<tr><td class="num">'+(i+1)+'</td><td class="aluno">'+r[0]+'</td>' + r.slice(1).map(v=>'<td>'+v+'</td>').join('') + '</tr>';
    });
    html += '</tbody></table></div>';
  });
  document.getElementById('tables').innerHTML = html;
}
renderTables();
</script>
</body>
